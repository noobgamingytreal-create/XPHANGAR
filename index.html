<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XPHANGAR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🛩️ X-Plane Freeware Hangar</h1>
        <p>Your community repository for community aircraft & mods</p>
    </header>

    <div class="container">
        <div class="aircraft-grid">

            <div class="aircraft-card">
                <div class="card-body">
                    <h3 class="aircraft-title">Boeing 737-800 Enhanced</h3>
                    <span class="meta-tag xp12">X-Plane 12</span>
                    <span class="meta-tag">Airliner</span>
                    <button class="download-btn" data-plane="Boeing 737-800">Download Mod</button>
                </div>
            </div>

            <div class="aircraft-card">
                <div class="card-body">
                    <h3 class="aircraft-title">Cessna 172 Community Edition</h3>
                    <span class="meta-tag">X-Plane 11 / 12</span>
                    <span class="meta-tag">General Aviation</span>
                    <button class="download-btn" data-plane="Cessna 172">Download Mod</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Linking your external JavaScript logic -->
    <script src="script.js"></script>
</body>
</html>
